<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer Hitung Mundur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: clean, nothing but the time and two buttons
   IDEA: a big lab stopwatch face
   PICTURE: the readout fills the top half, two colour fields fill the bottom half
   COLOUR and TYPE: aluminium/black ground, green start, red stop, grey when disabled; Geist Mono digits
   LAYOUT: top half presets + readout, bottom half split left/right */
:root{color-scheme:light dark;--bg:light-dark(#e9eaec,#141517);--ink:light-dark(#111,#eceef0);--line:light-dark(#c4c6ca,#34373c);--go:#16a34a;--st:#dc2626;--off:light-dark(#b9bbbf,#3a3d42);--offink:light-dark(#8a8d92,#6b6f75)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Geist,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:1fr 1fr}
.top{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;padding:10px 8px}
.presets{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;position:relative;z-index:2}
.presets button{font:500 clamp(16px,2.4vh,22px) Geist,sans-serif;min-height:44px;min-width:84px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;touch-action:manipulation}
.presets button.rst{border-style:dashed}
.presets button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.presets button:disabled{opacity:.35;cursor:default}
.read{font-family:"Geist Mono",ui-monospace,monospace;font-weight:500;font-size:min(18vw,34vh);line-height:1;letter-spacing:-.05em;pointer-events:none;position:relative;z-index:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ringing .read{color:var(--st);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.ringing .read{animation:none}}
.bottom{display:grid;grid-template-columns:1fr 1fr}
.big{border:0;margin:0;font:700 clamp(28px,7vh,64px) Geist,sans-serif;letter-spacing:.02em;color:#fff;cursor:pointer;touch-action:manipulation;transition:background .15s,color .15s}
#bStart{background:var(--go)}
#bStop{background:var(--st)}
.big:disabled{background:var(--off)!important;color:var(--offink);cursor:default}
.big:not(:disabled):active{filter:brightness(.88)}
.big:focus{outline:none}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="top">
    <div class="presets" id="presets">
      <button tabindex="-1" data-m="2" class="on">2 menit</button>
      <button tabindex="-1" data-m="3">3 menit</button>
      <button tabindex="-1" data-m="5">5 menit</button>
      <button tabindex="-1" id="bReset" class="rst">Reset</button>
    </div>
    <div class="read" id="read">02:00.000</div>
  </section>
  <section class="bottom">
    <button class="big" id="bStart" tabindex="-1">START</button>
    <button class="big" id="bStop" tabindex="-1" disabled>STOP</button>
  </section>
</div>

<script>
{
const $ = id => document.getElementById(id);
const app=$('app'), read=$('read'), bStart=$('bStart'), bStop=$('bStop'), presets=$('presets');
let state='idle', total=120000, remain=120000, endAt=0, raf=0, ctx=null, alarmTimer=0;

const fmt = ms => { ms=Math.max(0,Math.floor(ms)); const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60, x=ms%1000;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(x).padStart(3,'0'); };

function render(){
  read.textContent = fmt(remain);
  app.className = 'app '+state;
  const active = state==='running' || state==='ringing';
  bStart.disabled = active;
  bStop.disabled = !active;
  presets.querySelectorAll('button').forEach(b => b.disabled = active);
  $('bReset').disabled = active;
}

function tick(){
  remain = Math.max(0, endAt - performance.now());
  if (remain <= 0) { state='ringing'; render(); startAlarm(); return; }
  read.textContent = fmt(remain);
  raf = requestAnimationFrame(tick);
}

function audio(){ try { if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); } catch(e) {} }
function beep(t0){
  [0,.18,.36].forEach(d=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='square'; o.frequency.value=1760;
    g.gain.setValueAtTime(0,t0+d); g.gain.linearRampToValueAtTime(.25,t0+d+.01);
    g.gain.setValueAtTime(.25,t0+d+.12); g.gain.linearRampToValueAtTime(0,t0+d+.14);
    o.connect(g).connect(ctx.destination); o.start(t0+d); o.stop(t0+d+.15);
  });
}
function startAlarm(){ stopAlarm(); const go=()=>{ if(ctx) beep(ctx.currentTime+.02); }; go(); alarmTimer=setInterval(go,1000); }
function stopAlarm(){ clearInterval(alarmTimer); alarmTimer=0; }

function start(){
  if (state==='running' || state==='ringing') return;
  audio();
  if (remain <= 0) remain = total;
  endAt = performance.now() + remain; state='running'; render();
  cancelAnimationFrame(raf); tick();
}
function stop(){
  if (state==='running') { cancelAnimationFrame(raf); remain=Math.max(0,endAt-performance.now()); state='paused'; render(); }
  else if (state==='ringing') { stopAlarm(); state='idle'; remain=total; render(); }
}

function choose(m){
  if (state==='running' || state==='ringing') return;
  presets.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on', +x.dataset.m===m));
  total = m*60000; remain = total; state='idle'; render();
}
function reset(){
  if (state==='running' || state==='ringing') return;
  cancelAnimationFrame(raf); remain = total; state='idle'; render();
}
presets.addEventListener('pointerdown', e => {
  const b=e.target.closest('button'); if(!b || b.disabled) return;
  e.preventDefault();
  if (b.id==='bReset') reset(); else choose(+b.dataset.m);
});
// Halaman harus punya fokus agar tombol keyboard terbaca (penting bila dibuka di dalam frame)
const grab = () => { try { window.focus(); } catch(e) {} if (document.activeElement && document.activeElement!==document.body) document.activeElement.blur(); };
document.addEventListener('pointerdown', grab, true);
bStart.addEventListener('click', () => { start(); grab(); });
bStop.addEventListener('click', () => { stop(); grab(); });
grab();

const isStart = e => e.code==='Space' || e.key===' ';
const isStop = e => e.key==='Enter' || e.code==='Enter' || e.code==='NumpadEnter';
document.addEventListener('keydown', e => {
  if (isStart(e)) { e.preventDefault(); if(!e.repeat) start(); }
  else if (isStop(e)) { e.preventDefault(); if(!e.repeat) stop(); }
  else if (e.key==='r' || e.key==='R' || e.code==='KeyR') { e.preventDefault(); reset(); }
  else if (['2','3','5'].includes(e.key)) { e.preventDefault(); choose(+e.key); }
}, true);
document.addEventListener('keyup', e => { if (isStart(e) || isStop(e)) e.preventDefault(); }, true);
document.addEventListener('keypress', e => { if (isStart(e) || isStop(e)) e.preventDefault(); }, true);

render();
}
</script>
</body>
</html>
